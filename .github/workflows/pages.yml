name: Update coauthor network

on:
  push:
    branches: [main]
  schedule:
    - cron: '17 21 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: coauthor-network-pages
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: read
    outputs:
      changed: ${{ steps.compare.outputs.changed }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-test.txt
      - run: python -m pip install -r requirements-test.txt
      - name: Test counting rules and pinned public snapshot
        run: python -m unittest discover -s tests -v
      - name: Build from the latest public Research lists
        run: python -m scripts.build
      - name: Read Pages configuration
        id: pages
        uses: actions/configure-pages@v6
        with:
          enablement: false
      - name: Compare with the published app and data
        id: compare
        env:
          BASE_URL: ${{ steps.pages.outputs.base_url }}
        run: |
          url="${BASE_URL%/}/version.json?check=${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          code=$(curl --silent --show-error --location --retry 2 --retry-all-errors --max-time 30 \
            --output "$RUNNER_TEMP/live-version.json" --write-out '%{http_code}' "$url")
          case "$code" in
            200)
              if cmp --silent dist/version.json "$RUNNER_TEMP/live-version.json"; then
                echo 'changed=false' >> "$GITHUB_OUTPUT"
                echo 'The published app and public lists are current.' >> "$GITHUB_STEP_SUMMARY"
              else
                echo 'changed=true' >> "$GITHUB_OUTPUT"
              fi ;;
            404) echo 'changed=true' >> "$GITHUB_OUTPUT" ;;
            *) echo "Could not check Pages manifest (HTTP $code)" >&2; exit 1 ;;
          esac
      - name: Test the artifact in Chrome
        if: steps.compare.outputs.changed == 'true' || github.event_name != 'schedule'
        run: python tests/browser.py
      - uses: actions/upload-pages-artifact@v5
        if: steps.compare.outputs.changed == 'true'
        with:
          path: dist

  deploy:
    needs: build
    if: needs.build.outputs.changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy tested site
        id: deployment
        uses: actions/deploy-pages@v5
