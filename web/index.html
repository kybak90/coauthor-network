<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f9fbfa">
  <meta name="description" content="Explore Kwan-Young Bak’s coauthor network and the papers behind each collaboration.">
  <title>Coauthor network · Kwan-Young Bak</title>
  <link rel="icon" href="./network.svg" type="image/svg+xml">
  <link rel="stylesheet" href="./style.css">
  <script type="module" src="./app.js"></script>
</head>
<body>
  <svg class="symbols" aria-hidden="true" xmlns="http://www.w3.org/2000/svg">
    <symbol id="book" viewBox="0 0 24 24"><path d="M3 5c4-1 6 0 9 2 3-2 5-3 9-2v14c-4-1-6 0-9 2-3-2-5-3-9-2zM12 7v14"/></symbol>
    <symbol id="plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
    <symbol id="minus" viewBox="0 0 24 24"><path d="M5 12h14"/></symbol>
    <symbol id="reset-icon" viewBox="0 0 24 24"><path d="M4 10a8 8 0 1 1 .8 6M4 4v6h6"/></symbol>
    <symbol id="down" viewBox="0 0 24 24"><path d="m6 9 6 6 6-6"/></symbol>
  </svg>
  <div class="shell">
    <header class="mast">
      <span class="identity"><img src="./network.svg" alt="" width="30" height="30">Kwan-Young Bak</span>
      <a class="source" href="https://kybak90.github.io/publications/"><svg class="icon"><use href="#book"/></svg>Lab research</a>
    </header>
    <main>
      <div class="page-heading">
        <h1>Coauthor network</h1>
        <fieldset class="modes" aria-label="Papers included in the network">
          <label><input type="radio" name="mode" value="accepted" checked><span>Accepted &amp; published</span></label>
          <label><input type="radio" name="mode" value="ongoing"><span>Include ongoing</span></label>
        </fieldset>
      </div>
      <p id="status" role="status">Loading the public paper lists…</p>
      <section class="network" aria-label="Coauthor graph">
        <div class="graph-bar">
          <div class="totals" aria-live="polite">
            <span><b id="author-count">–</b> authors</span>
            <span><b id="edge-count">–</b> connections</span>
            <span><b id="paper-count">–</b> papers</span>
          </div>
          <label class="center-control">Center on <span class="select-wrap">
            <select id="center" aria-label="Center on author"></select>
            <svg class="icon"><use href="#down"/></svg>
          </span></label>
        </div>
        <div class="plot">
          <a class="skip" href="#paper-toggle">Skip to papers</a>
          <svg id="graph" role="group" aria-label="Interactive coauthor graph" aria-describedby="graph-help">
            <g id="edges"></g><g id="nodes"></g>
          </svg>
          <div id="tooltip" role="tooltip" hidden></div>
        </div>
        <div class="graph-footer">
          <p id="graph-help"><span class="weight-key" aria-hidden="true"></span><span>Thicker lines mean more shared papers.<span class="edge-hint"> Select a line to see its papers.</span></span></p>
          <div class="plot-tools" aria-label="Graph controls">
            <button id="zoom-out" aria-label="Zoom out" title="Zoom out"><svg class="icon"><use href="#minus"/></svg></button>
            <button id="zoom-in" aria-label="Zoom in" title="Zoom in"><svg class="icon"><use href="#plus"/></svg></button>
            <button id="reset" title="Restore the default node positions and zoom"><svg class="icon"><use href="#reset-icon"/></svg>Reset layout</button>
          </div>
        </div>
      </section>
      <section class="papers" aria-labelledby="paper-toggle">
        <div class="paper-bar">
          <h2><button id="paper-toggle" aria-expanded="true" aria-controls="table-scroll">
            Papers <span id="row-count">–</span><svg class="icon"><use href="#down"/></svg>
          </button></h2>
          <span id="pair-caption" hidden></span>
          <button id="all-papers" class="text-button" hidden>All papers</button>
          <button id="clear-paper" class="text-button" hidden>Clear selection</button>
        </div>
        <div id="table-scroll" tabindex="0" role="region" aria-label="Scrollable paper list">
          <table aria-label="Papers in the current view">
            <colgroup><col class="title-col"><col class="venue-col"><col class="authors-col"></colgroup>
            <thead><tr><th scope="col">Title</th><th scope="col">Journal / Venue</th><th scope="col">Authors</th></tr></thead>
            <tbody id="rows"></tbody>
          </table>
        </div>
      </section>
    </main>
  </div>
</body>
</html>
